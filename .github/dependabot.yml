version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /environments/*/*/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
